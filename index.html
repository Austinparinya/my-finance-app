<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance & Debt Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-2xl mx-auto space-y-6">
      <!-- Header -->
      <header
        class="text-center bg-slate-800/60 p-4 rounded-xl border border-slate-700"
      >
        <h1 class="text-xl md:text-2xl font-bold text-emerald-400">
          💰 Financial & Debt Planner
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          แอปคำนวณรายจ่าย หนี้ตัวเอง และเงินเดือนล่วงหน้า
        </p>
      </header>

      <!-- Filter แท็บเลือกดูผู้ใช้ -->
      <div
        class="flex bg-slate-800 p-1.5 rounded-xl border border-slate-700 space-x-1"
      >
        <button
          onclick="setFilter('all')"
          id="tab-all"
          class="flex-1 py-2 text-xs font-semibold rounded-lg bg-emerald-500 text-white transition"
        >
          🌟 รวมทุกคน
        </button>
        <button
          onclick="setFilter('me')"
          id="tab-me"
          class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition"
        >
          👤 ของฉัน
        </button>
        <button
          onclick="setFilter('partner')"
          id="tab-partner"
          class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition"
        >
          👩‍🦰 ของแฟน
        </button>
      </div>

      <!-- สรุปยอดเงิน -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <span class="text-xs text-slate-400">ยอดเงินคงเหลือคำนวณ</span>
          <div
            id="netBalance"
            class="text-xl md:text-2xl font-bold text-emerald-400 mt-1"
          >
            ฿0
          </div>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <span class="text-xs text-slate-400">ยอดติดหนี้เงินเก็บตัวเอง</span>
          <div
            id="totalDebt"
            class="text-xl md:text-2xl font-bold text-rose-400 mt-1"
          >
            ฿0
          </div>
        </div>
      </div>

      <!-- กราฟสรุปสัดส่วน (Chart.js) -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h2 class="text-sm font-semibold text-slate-300 mb-3">
          📊 สรุปสัดส่วนการเงิน
        </h2>
        <div class="h-52 flex justify-center">
          <canvas id="financeChart"></canvas>
        </div>
      </div>

      <!-- ฟอร์มคำนวณ OT & เงินเดือนล่วงหน้า -->
      <div
        class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3"
      >
        <h2 class="text-sm font-semibold text-sky-300">
          ⚡ คำนวณรายได้ล่วงหน้า (เงินเดือน + OT)
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <input
            type="number"
            id="baseSalary"
            placeholder="เงินเดือนฐาน (฿)"
            class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-sky-500"
          />
          <input
            type="number"
            id="otHours"
            placeholder="จำนวนชั่วโมง OT"
            class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-sky-500"
          />
          <input
            type="number"
            id="otRate"
            placeholder="เรท OT ต่อ ชม. (฿)"
            class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-sky-500"
          />
        </div>
        <div
          class="flex justify-between items-center pt-2 border-t border-slate-700/60"
        >
          <span class="text-xs text-slate-400">ประมาณการรายได้สิ้นเดือน:</span>
          <span id="forecastResult" class="font-bold text-sky-400">฿0</span>
        </div>
      </div>

      <!-- ฟอร์มบันทึกรายการ -->
      <form
        id="txForm"
        class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4"
      >
        <h2 class="text-base font-semibold">➕ บันทึกรายการใหม่</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <!-- เลือกว่าเป็นของใคร -->
          <select
            id="txOwner"
            class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-sky-400 font-medium"
          >
            <option value="me">👤 ของฉัน</option>
            <option value="partner">👩‍🦰 ของแฟน</option>
            <option value="shared">🏠 ส่วนกลาง</option>
          </select>
          <select
            id="txType"
            class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm"
          >
            <option value="expense">🔴 รายจ่าย</option>
            <option value="income">🟢 รายรับ (เงินเดือน/โบนัส/OT)</option>
            <option value="self_debt">🟡 หนี้ตัวเอง (ยืมเงินเก็บ)</option>
          </select>
          <input
            type="text"
            id="txTitle"
            placeholder="ชื่อรายการ"
            required
            class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm"
          />
          <input
            type="number"
            id="txAmount"
            placeholder="จำนวนเงิน (฿)"
            required
            class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-emerald-500 hover:bg-emerald-600 font-semibold py-2.5 rounded-lg text-sm transition"
        >
          บันทึกข้อมูล
        </button>
      </form>

      <!-- รายการย้อนหลัง -->
      <div
        class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3"
      >
        <h2 class="text-base font-semibold">📋 รายการล่าสุด</h2>
        <div id="txList" class="space-y-2 text-sm"></div>
      </div>
    </div>

    <script>
      // ⚙️ นำค่าจาก Supabase Project ของคุณมาใส่ตรงนี้
      const SUPABASE_URL = "https://osewhzluebkmpvhppvwy.supabase.co/rest/v1/";
      const SUPABASE_ANON_KEY =
        "sb_publishable_8IpUC9wg3pslX7lSo_3KzQ_mMrouo8O";
      const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      let myChart = null;
      let currentFilter = "all"; // 'all', 'me', 'partner'

      function setFilter(filter) {
        currentFilter = filter;
        // ปรับ Style ปุ่ม Tab
        ["all", "me", "partner"].forEach((tab) => {
          const btn = document.getElementById(`tab-${tab}`);
          if (tab === filter) {
            btn.className =
              "flex-1 py-2 text-xs font-semibold rounded-lg bg-emerald-500 text-white transition";
          } else {
            btn.className =
              "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
          }
        });
        loadTransactions();
      }

      // คำนวณ OT ล่วงหน้า
      const baseSalary = document.getElementById("baseSalary");
      const otHours = document.getElementById("otHours");
      const otRate = document.getElementById("otRate");
      const forecastResult = document.getElementById("forecastResult");

      function calcForecast() {
        const salary = parseFloat(baseSalary.value) || 0;
        const hours = parseFloat(otHours.value) || 0;
        const rate = parseFloat(otRate.value) || 0;
        forecastResult.textContent = `฿${(salary + hours * rate).toLocaleString()}`;
      }
      [baseSalary, otHours, otRate].forEach((el) =>
        el.addEventListener("input", calcForecast),
      );

      // กราฟสรุป
      function renderChart(income, expense, debt) {
        const ctx = document.getElementById("financeChart").getContext("2d");
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: ["รายรับ", "รายจ่าย", "หนี้ตัวเอง"],
            datasets: [
              {
                data: [income, expense, debt],
                backgroundColor: ["#34d399", "#f87171", "#fbbf24"],
                borderWidth: 0,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: "bottom", labels: { color: "#94a3b8" } },
            },
          },
        });
      }

      // แปลงชื่อ Owner เป็น Badge แสดง
      function getOwnerBadge(owner) {
        if (owner === "me")
          return `<span class="text-[10px] bg-sky-500/20 text-sky-400 px-1.5 py-0.5 rounded border border-sky-500/30">ฉัน</span>`;
        if (owner === "partner")
          return `<span class="text-[10px] bg-pink-500/20 text-pink-400 px-1.5 py-0.5 rounded border border-pink-500/30">แฟน</span>`;
        return `<span class="text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded">ส่วนกลาง</span>`;
      }

      // โหลดข้อมูลตาม Filter
      async function loadTransactions() {
        let query = supabase
          .from("transactions")
          .select("*")
          .order("created_at", { ascending: false });

        if (currentFilter !== "all") {
          query = query.eq("owner", currentFilter);
        }

        const { data, error } = await query;
        if (error) return console.error(error);

        let totalIncome = 0;
        let totalExpense = 0;
        let totalSelfDebt = 0;
        const listEl = document.getElementById("txList");
        listEl.innerHTML = "";

        if (!data || data.length === 0) {
          listEl.innerHTML =
            '<div class="text-center text-slate-500 py-4">ไม่มีรายการในช่วงนี้</div>';
        } else {
          data.forEach((item) => {
            const val = Number(item.amount);
            if (item.type === "income") totalIncome += val;
            if (item.type === "expense") totalExpense += val;
            if (item.type === "self_debt") totalSelfDebt += val;

            const typeColor =
              item.type === "income"
                ? "text-emerald-400"
                : item.type === "expense"
                  ? "text-rose-400"
                  : "text-amber-400";
            const sign = item.type === "income" ? "+" : "-";

            const row = `
            <div class="flex justify-between items-center p-3 bg-slate-900/50 rounded-lg border border-slate-700/50">
              <div class="space-y-0.5">
                <div class="flex items-center space-x-2">
                  <span class="font-medium">${item.title}</span>
                  ${getOwnerBadge(item.owner)}
                </div>
                <div class="text-xs text-slate-500">${new Date(item.created_at).toLocaleDateString("th-TH")}</div>
              </div>
              <div class="font-bold ${typeColor}">${sign}฿${val.toLocaleString()}</div>
            </div>
          `;
            listEl.insertAdjacentHTML("beforeend", row);
          });
        }

        document.getElementById("netBalance").textContent =
          `฿${(totalIncome - totalExpense).toLocaleString()}`;
        document.getElementById("totalDebt").textContent =
          `฿${totalSelfDebt.toLocaleString()}`;

        renderChart(totalIncome, totalExpense, totalSelfDebt);
      }

      // บันทึกรายการใหม่
      document
        .getElementById("txForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const owner = document.getElementById("txOwner").value;
          const type = document.getElementById("txType").value;
          const title = document.getElementById("txTitle").value;
          const amount = parseFloat(document.getElementById("txAmount").value);

          const { error } = await supabase
            .from("transactions")
            .insert([{ owner, type, title, amount }]);

          if (error) {
            alert("เกิดข้อผิดพลาด: " + error.message);
          } else {
            document.getElementById("txTitle").value = "";
            document.getElementById("txAmount").value = "";
            loadTransactions();
          }
        });

      loadTransactions();
    </script>
  </body>
</html>
